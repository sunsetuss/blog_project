
{% extends 'blog/base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}

<div class="article">
    <h2>{{ page_title }}</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Сохранить</button>
        <a href="{% url 'my_articles' %}">Отмена</a>
    </form>
</div>

{% endblock %}
