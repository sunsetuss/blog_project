{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Блог с рубриками{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}?v=3">
</head>
<body>

    <header>
        <h1>
            <a href="{% url 'article_list' %}">
                Блог с рубриками
            </a>
        </h1>

        <nav class="navigation">
            <a href="/admin/">Админ-панель</a>

            {% if user.is_authenticated %}
                <a href="{% url 'my_articles' %}">Мои статьи</a>
                <a href="{% url 'article_create' %}">Создать статью</a>

                <span class="username">{{ user.username }}</span>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Войти</a>
                <a href="{% url 'register' %}">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    {% block content %}{% endblock %}

</body>
</html>
